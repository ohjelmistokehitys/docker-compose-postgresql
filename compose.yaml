services:
  postgres:
    image: postgres:latest
    container_name: database
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql
      - ./sql:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: database-admin
    env_file:
      - .env
    ports:
      - "8080:80"
volumes:
  pgdata:
